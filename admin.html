<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOJONINE KOREA · 주문 접수자 데모</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body class="admin-body"><header class="admin-header"><div class="wrap admin-head"><b>MOJONINE KOREA · ORDER RECEIVER</b><span class="admin-tag">RECEIVER DEMO</span></div></header><main class="admin-main"><div class="wrap"><div class="admin-title"><div><h1>주문 접수함</h1><p>주문자 화면에서 생성한 검수용 주문을 같은 브라우저에서 확인합니다.</p></div><div class="admin-actions"><a href="index.html">← 주문자 화면</a><button class="muted" id="clear">데모 주문 비우기</button></div></div><div class="orders" id="orders"></div></div></main><script>
const PRODUCTS={sweet:{name:'황금한입 고구마칩',unit:'박스'},dryer:{name:'HANBUL 헤어드라이어',unit:'개'},sesame:{name:'오모나 참깨강정',unit:'박스'}};const STATUS={received:'신규 접수',checked:'확인',packing:'출고 준비',shipped:'발송 완료'};const esc=s=>String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function get(){return JSON.parse(localStorage.getItem('m9-order-demo')||'[]')}function save(v){localStorage.setItem('m9-order-demo',JSON.stringify(v))}function render(){const list=get(),el=document.getElementById('orders');if(!list.length){el.innerHTML='<div class="empty-admin">아직 접수된 데모 주문이 없습니다.</div>';return}el.innerHTML=list.map((o,idx)=>`<article class="order-card"><div class="order-top"><div><span class="order-code-admin">${esc(o.code)}</span><span class="order-date">${new Date(o.created).toLocaleString('ko-KR')}</span></div><select class="status-select" data-status="${idx}">${Object.entries(STATUS).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="order-columns"><div><div class="col-title">주문 품목</div><div class="col-body">${Object.entries(o.cart||{}).filter(([,q])=>q>0).map(([id,q])=>`${esc(PRODUCTS[id].name)} <b>${q}${PRODUCTS[id].unit}</b>`).join('<br>')}</div></div><div><div class="col-title">거래처</div><div class="col-body"><b>${esc(o.company)}</b><br>${esc(o.contact)} · ${esc(o.phone)}<br>${esc(o.email||'')}</div></div><div><div class="col-title">배송·요청</div><div class="col-body">${esc(o.address)}<br>희망일 ${esc(o.deliveryDate||'미지정')}<br>${esc(o.memo||'요청사항 없음')}</div></div></div></article>`).join('');document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{const arr=get();arr[Number(s.dataset.status)].status=s.value;save(arr);render()})}document.getElementById('clear').onclick=()=>{if(confirm('데모 주문을 모두 비울까요?')){localStorage.removeItem('m9-order-demo');render()}};render();
</script></body></html>
